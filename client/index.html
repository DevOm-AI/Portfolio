<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF7F2" />
    <!-- Apply the theme before first paint (saved choice, else the OS setting) to avoid a flash. -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        root.style.colorScheme = theme;
        if (theme === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0E1015");
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Om Shete - Software Engineer</title>
    <meta name="description" content="Portfolio of Om Shete, a Software Engineer and Backend Engineer specializing in Artificial Intelligence, Data Science, and Web Development. Explore projects, skills, and experience." />
    <meta property="og:title" content="Om Shete - Software Engineer Portfolio" />
    <meta property="og:description" content="Software Engineer and Backend Engineer with expertise in Machine Learning, Computer Vision, and Web Development" />
    <meta property="og:type" content="website" />
    <!-- Fonts are self-hosted via @fontsource-variable (imported in src/main.tsx). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
